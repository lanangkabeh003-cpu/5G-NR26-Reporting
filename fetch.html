<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cluster Report - Modular Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-8" 
      x-data="{ cluster: {} }" 
      x-init="fetch('cluster_data.json').then(res => res.json()).then(data => cluster = data)">

    <div class="max-w-4xl mx-auto bg-slate-900 p-6 rounded-xl border border-slate-800">
        <h1 class="text-2xl font-bold mb-2" x-text="'Cluster: ' + cluster.cluster_name"></h1>
        <p class="text-slate-400 text-sm mb-6" x-text="'Periode: ' + cluster.period"></p>

        <h3 class="text-lg font-semibold mb-3">Daftar Site Aktif</h3>
        <div class="space-y-3">
            <template x-for="site in cluster.sites">
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-emerald-400" x-text="site.name"></p>
                        <p class="text-xs text-slate-400" x-text="'Site ID: ' + site.site_id + ' | Azimuth: ' + site.azimuth"></p>
                    </div>
                    <span class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs" x-text="site.status"></span>
                </div>
            </template>
        </div>
    </div>

</body>
</html>
